}

}

main {

h2 {

}

<script>


/******************************************************************************
 * Mini biblioteca XLSX para navegadores modernos (vanilla JS, zero deps)
 * Leitura: ZIP + DecompressionStream (nativo) + parser XML proprio (regex)
 * Escrita: ZIP STORED (sem compressão) + CRC32 manual
 *****************************************************************************/

// ========== Utilitários ZIP & CRC32 ==========

const CRC_TABLE = (() => {
  const table = new Uint32Array(256);
  for (let i = 0; i < 256; i++) {
    let c = i;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    table[i] = c;
  }
  return table;
})();

function crc32(data) {
  let crc = 0xFFFFFFFF;
  for (let i = 0; i < data.length; i++)
    crc = CRC_TABLE[(crc ^ data[i]) & 0xFF] ^ (crc >>> 8);
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

async function unzip(arrayBuffer) {
  const view = new DataView(arrayBuffer);
  const entries = new Map();

  let eocdOffset = -1;
  for (let i = view.byteLength - 22; i >= Math.max(0, view.byteLength - 65557); i--) {
    if (view.getUint32(i, true) === 0x06054b50) { eocdOffset = i; break; }
  }
  if (eocdOffset === -1) throw new Error('ZIP inválido: EOCD não encontrado');

  const cdOffset = view.getUint32(eocdOffset + 16, true);
  const cdSize = view.getUint32(eocdOffset + 12, true);

  let offset = cdOffset;
  while (offset < cdOffset + cdSize) {
    if (view.getUint32(offset, true) !== 0x02014b50) break;
    const nameLen = view.getUint16(offset + 28, true);
    const extraLen = view.getUint16(offset + 30, true);
    const commentLen = view.getUint16(offset + 32, true);
    const localOffset = view.getUint32(offset + 42, true);
    const name = new TextDecoder().decode(new Uint8Array(arrayBuffer, offset + 46, nameLen));

    entries.set(name, {
      compressedSize: view.getUint32(offset + 20, true),
      compressionMethod: view.getUint16(offset + 10, true),
      localOffset
    });
    offset += 46 + nameLen + extraLen + commentLen;
  }

  const files = {};
  for (const [name, meta] of entries) {
    const localNameLen = view.getUint16(meta.localOffset + 26, true);
    const localExtraLen = view.getUint16(meta.localOffset + 28, true);
    const dataOffset = meta.localOffset + 30 + localNameLen + localExtraLen;
    const compressedData = new Uint8Array(arrayBuffer, dataOffset, meta.compressedSize);

    if (meta.compressionMethod === 0) {
      files[name] = compressedData.slice();
    } else if (meta.compressionMethod === 8) {
      const ds = new DecompressionStream('deflate-raw');
      const writer = ds.writable.getWriter();
      writer.write(compressedData);
      writer.close();
      const chunks = [];
      const reader = ds.readable.getReader();
      while (true) {
        const {done, value} = await reader.read();
        if (done) break;
        chunks.push(value);
      }
      const totalLen = chunks.reduce((sum, c) => sum + c.length, 0);
      const result = new Uint8Array(totalLen);
      let pos = 0;
      for (const chunk of chunks) { result.set(chunk, pos); pos += chunk.length; }
      files[name] = result;
    } else {
      throw new Error(`ZIP: método de compressão ${meta.compressionMethod} não suportado`);
    }
  }
  return files;
}

function buildZIP(files) {
  const encoder = new TextEncoder();
  const localHeaders = [];
  const centralDirectory = [];
  let offset = 0;

  for (const [name, data] of Object.entries(files)) {
    const nameBytes = encoder.encode(name);
    const crc = crc32(data);
    const size = data.length;

    const localHdr = new Uint8Array(30 + nameBytes.length + data.length);
    const localView = new DataView(localHdr.buffer);
    localView.setUint32(0, 0x04034b50, true);
    localView.setUint16(4, 20, true);
    localView.setUint16(6, 0, true);
    localView.setUint16(8, 0, true);          // método 0 = STORED
    localView.setUint16(10, 0, true);
    localView.setUint16(12, 0x21, true);
    localView.setUint32(14, crc, true);
    localView.setUint32(18, size, true);
    localView.setUint32(22, size, true);
    localView.setUint16(26, nameBytes.length, true);
    localView.setUint16(28, 0, true);
    localHdr.set(nameBytes, 30);
    localHdr.set(data, 30 + nameBytes.length);
    localHeaders.push(localHdr);

    const cdEntry = new Uint8Array(46 + nameBytes.length);
    const cdView = new DataView(cdEntry.buffer);
    cdView.setUint32(0, 0x02014b50, true);
    cdView.setUint16(4, 20, true);
    cdView.setUint16(6, 20, true);
    cdView.setUint16(8, 0, true);
    cdView.setUint16(10, 0, true);
    cdView.setUint16(12, 0, true);
    cdView.setUint16(14, 0x21, true);
    cdView.setUint32(16, crc, true);
    cdView.setUint32(20, size, true);
    cdView.setUint32(24, size, true);
    cdView.setUint16(28, nameBytes.length, true);
    cdView.setUint16(30, 0, true);
    cdView.setUint16(32, 0, true);
    cdView.setUint16(34, 0, true);
    cdView.setUint16(36, 0, true);
    cdView.setUint32(38, 0x20, true);
    cdView.setUint32(42, offset, true);
    cdEntry.set(nameBytes, 46);
    centralDirectory.push(cdEntry);

    offset += localHdr.length;
  }

  const cdStart = offset;
  const cdSize = centralDirectory.reduce((s, e) => s + e.length, 0);
  const eocd = new Uint8Array(22);
  const eocdView = new DataView(eocd.buffer);
  eocdView.setUint32(0, 0x06054b50, true);
  eocdView.setUint16(4, 0, true);
  eocdView.setUint16(6, 0, true);
  eocdView.setUint16(8, centralDirectory.length, true);
  eocdView.setUint16(10, centralDirectory.length, true);
  eocdView.setUint32(12, cdSize, true);
  eocdView.setUint32(16, cdStart, true);
  eocdView.setUint16(20, 0, true);

  const totalSize = localHeaders.reduce((s, h) => s + h.length, 0) + cdSize + 22;
  const zip = new Uint8Array(totalSize);
  let pos = 0;
  for (const h of localHeaders) { zip.set(h, pos); pos += h.length; }
  for (const cd of centralDirectory) { zip.set(cd, pos); pos += cd.length; }
  zip.set(eocd, pos);
  return zip;
}

// ========== Parse XLSX ==========

function colLetterToIndex(ref) {
  const m = ref.match(/^([A-Z]+)/);
  let col = 0;
  for (const ch of m[1]) col = col * 26 + (ch.charCodeAt(0) - 64);
  return col - 1;
}

function colIndexToLetter(idx) {
  let n = idx + 1;
  let letter = '';
  while (n > 0) {
    const rem = (n - 1) % 26;
    letter = String.fromCharCode(65 + rem) + letter;
    n = Math.floor((n - 1) / 26);
  }
  return letter;
}

function xmlEscape(s) {
  if (s === null || s === undefined) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&apos;')
    .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, '');
}


// ========== XML helpers (parser proprio, regexes literais fixas - sem DOMParser) ==========

function xmlUnescape(s) {
  return s
    .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"')
    .replace(/&apos;/g, "'")
    .replace(/&#x([0-9a-fA-F]+);/g, function(_, h) { return String.fromCodePoint(parseInt(h, 16)); })
    .replace(/&#(\d+);/g, function(_, d) { return String.fromCodePoint(parseInt(d, 10)); })
    .replace(/&amp;/g, '&');
}

function getAttr(tagStr, attrName) {
  var escaped = attrName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  var re = new RegExp('(?:^|\\s)' + escaped + '\\s*=\\s*"([^"]*)"');
  var m = tagStr.match(re);
  return m ? xmlUnescape(m[1]) : null;
}

function findSheetTags(xml) {
  var re = /<sheet(\s[^>]*?)?\/?>/g;
  var out = [];
  var m;
  while ((m = re.exec(xml)) !== null) out.push(m[1] || '');
  return out;
}

function findRelationshipTags(xml) {
  var re = /<Relationship(\s[^>]*?)?\/?>/g;
  var out = [];
  var m;
  while ((m = re.exec(xml)) !== null) out.push(m[1] || '');
  return out;
}

function findSiBlocks(xml) {
  var re = /<si(?:\s[^>]*?)?>([\s\S]*?)<\/si>/g;
  var out = [];
  var m;
  while ((m = re.exec(xml)) !== null) out.push(m[1]);
  return out;
}

function findTBlocks(xml) {
  var re = /<t(?:\s[^>]*?)?>([\s\S]*?)<\/t>/g;
  var out = [];
  var m;
  while ((m = re.exec(xml)) !== null) out.push(m[1]);
  return out;
}

function findRowBlocks(xml) {
  var re = /<row(?:\s[^>]*?)?>([\s\S]*?)<\/row>/g;
  var out = [];
  var m;
  while ((m = re.exec(xml)) !== null) out.push(m[1]);
  return out;
}

function findIsBlocks(xml) {
  var re = /<is(?:\s[^>]*?)?>([\s\S]*?)<\/is>/g;
  var out = [];
  var m;
  while ((m = re.exec(xml)) !== null) out.push(m[1]);
  return out;
}

function findVBlocks(xml) {
  var re = /<v(?:\s[^>]*?)?>([\s\S]*?)<\/v>/g;
  var out = [];
  var m;
  while ((m = re.exec(xml)) !== null) out.push(m[1]);
  return out;
}

// ========== Leitura de sharedStrings.xml ==========
function parseSharedStrings(xml) {
  var siBlocks = findSiBlocks(xml);
  return siBlocks.map(function(si) {
    var tBlocks = findTBlocks(si);
    return tBlocks.map(xmlUnescape).join('');
  });
}

// ========== Leitura de uma planilha (sheetN.xml) ==========
function parseSheetXML(xml, sharedStrings) {
  var rowBlocks = findRowBlocks(xml);
  var rows = [];
  var cellRe = /<c(\s[^>]*?)?(?:\/>|>([\s\S]*?)<\/c>)/g;
  for (var ri = 0; ri < rowBlocks.length; ri++) {
    var rowInner = rowBlocks[ri];
    var rowData = [];
    cellRe.lastIndex = 0;
    var cm;
    while ((cm = cellRe.exec(rowInner)) !== null) {
      var attrs = cm[1] || '';
      var inner = cm[2] || '';
      var ref = getAttr(attrs, 'r');
      var type = getAttr(attrs, 't') || 'n';
      var idx = ref ? colLetterToIndex(ref) : rowData.length;

      var value = '';
      if (type === 'inlineStr') {
        var isBlocks = findIsBlocks(inner);
        var isInner = isBlocks.length ? isBlocks[0] : inner;
        var tBlocks = findTBlocks(isInner);
        value = tBlocks.map(xmlUnescape).join('');
      } else {
        var vBlocks = findVBlocks(inner);
        var vRaw = vBlocks.length ? vBlocks[0] : '';
        value = xmlUnescape(vRaw);
        if (type === 's' && vRaw !== '') {
          var si = parseInt(vRaw, 10);
          value = (sharedStrings[si] !== undefined) ? sharedStrings[si] : '';
        }
      }
      while (rowData.length < idx) rowData.push('');
      rowData[idx] = value;
    }
    rows.push(rowData);
  }
  return rows;
}

async function readXLSX(arrayBuffer) {
  try {
    const files = await unzip(arrayBuffer);
    const decoder = new TextDecoder('utf-8');

    if (!files['xl/workbook.xml']) {
      throw new Error('XLSX invalido: xl/workbook.xml nao encontrado. Verifique se e um arquivo .xlsx valido (nao .xls).');
    }
    const wbXML = decoder.decode(files['xl/workbook.xml']);
    const sheetTags = findSheetTags(wbXML);
    if (!Array.isArray(sheetTags)) {
      throw new Error('[BUG INTERNO] findSheetTags nao retornou um array. Tipo: ' + typeof sheetTags);
    }
    if (sheetTags.length === 0) {
      throw new Error('XLSX invalido: nenhuma planilha encontrada em workbook.xml');
    }
    const sheetRid = getAttr(sheetTags[0], 'r:id') || getAttr(sheetTags[0], 'id');
    if (!sheetRid) {
      throw new Error('XLSX invalido: planilha sem referencia r:id em workbook.xml');
    }

    if (!files['xl/_rels/workbook.xml.rels']) {
      throw new Error('XLSX invalido: xl/_rels/workbook.xml.rels nao encontrado');
    }
    const relsXML = decoder.decode(files['xl/_rels/workbook.xml.rels']);
    const relTags = findRelationshipTags(relsXML);
    if (!Array.isArray(relTags)) {
      throw new Error('[BUG INTERNO] findRelationshipTags nao retornou um array. Tipo: ' + typeof relTags);
    }
    const relTag = relTags.find(function(t) { return getAttr(t, 'Id') === sheetRid; });
    if (!relTag) {
      throw new Error('XLSX invalido: relacao da planilha nao encontrada em workbook.xml.rels');
    }
    let sheetTarget = getAttr(relTag, 'Target');
    if (!sheetTarget) {
      throw new Error('XLSX invalido: Target da planilha ausente em workbook.xml.rels');
    }
    if (sheetTarget.startsWith('/')) sheetTarget = sheetTarget.slice(1);
    const sheetPath = sheetTarget.startsWith('xl/') ? sheetTarget : ('xl/' + sheetTarget);

    if (!files[sheetPath]) {
      throw new Error('XLSX invalido: arquivo da planilha "' + sheetPath + '" nao encontrado dentro do pacote');
    }

    let sharedStrings = [];
    if (files['xl/sharedStrings.xml']) {
      sharedStrings = parseSharedStrings(decoder.decode(files['xl/sharedStrings.xml']));
      if (!Array.isArray(sharedStrings)) {
        throw new Error('[BUG INTERNO] parseSharedStrings nao retornou um array. Tipo: ' + typeof sharedStrings);
      }
    }

    const sheetXMLStr = decoder.decode(files[sheetPath]);
    const rows = parseSheetXML(sheetXMLStr, sharedStrings);
    if (!Array.isArray(rows)) {
      throw new Error('[BUG INTERNO] parseSheetXML nao retornou um array. Tipo: ' + typeof rows);
    }

    if (rows.length === 0) {
      console.warn('[readXLSX] Planilha vazia (sem linhas de dados)');
      return {headers: [], data: []};
    }
    const headers = rows[0].map(function(h) { return (h || '').trim(); });
    if (!Array.isArray(headers)) {
      throw new Error('[BUG INTERNO] headers.map nao retornou um array');
    }
    const data = rows.slice(1)
      .filter(function(row) { return row.some(function(v) { return v !== '' && v !== undefined; }); })
      .map(function(row) {
        const obj = {};
        headers.forEach(function(h, i) { obj[h] = (row[i] !== undefined ? row[i] : ''); });
        return obj;
      });
    if (!Array.isArray(data)) {
      throw new Error('[BUG INTERNO] data.map nao retornou um array');
    }
    console.log('[readXLSX] Sucesso: ' + headers.length + ' colunas, ' + data.length + ' linhas');
    return {headers, data};
  } catch (e) {
    console.error('[readXLSX] ERRO:', e);
    throw new Error('Erro ao ler arquivo XLSX: ' + e.message);
  }
}


function writeXLSX(sheets) {
  const encoder = new TextEncoder();

  let sheetOverrides = '';
  for (let i = 0; i < sheets.length; i++)
    sheetOverrides += `<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`;
  const contentTypes = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheetOverrides}<Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/><Override PartName="/docProps/app.xml" ContentType="application/vnd.openxmlformats-officedocument.extended-properties+xml"/></Types>`;

  const rootRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/><Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/extended-properties" Target="docProps/app.xml"/></Relationships>`;

  const coreProps = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/"><dc:creator>Validador de Bases</dc:creator></cp:coreProperties>`;
  const appProps = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Properties xmlns="http://schemas.openxmlformats.org/officeDocument/2006/extended-properties"><Application>Validador de Bases</Application></Properties>`;

  let sheetEntries = '';
  for (let i = 0; i < sheets.length; i++)
    sheetEntries += `<sheet name="${xmlEscape(sheets[i].name)}" sheetId="${i+1}" r:id="rSheet${i+1}"/>`;
  const workbook = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheetEntries}</sheets></workbook>`;

  let wbRels = '';
  for (let i = 0; i < sheets.length; i++)
    wbRels += `<Relationship Id="rSheet${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`;
  wbRels += `<Relationship Id="rStyles" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>`;
  const workbookRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${wbRels}</Relationships>`;

  const styles = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF1F4E78"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1" applyAlignment="1"><alignment horizontal="center" vertical="center"/></xf></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;

  const worksheets = {};
  for (let idx = 0; idx < sheets.length; idx++) {
    const {headers, rows} = sheets[idx];
    const lastCol = colIndexToLetter(headers.length - 1);
    const lastRow = rows.length + 1;

    let sheetData = `<row r="1">`;
    headers.forEach((h, col) => {
      sheetData += `<c r="${colIndexToLetter(col)}1" t="inlineStr" s="1"><is><t xml:space="preserve">${xmlEscape(h)}</t></is></c>`;
    });
    sheetData += `</row>`;

    for (let r = 0; r < rows.length; r++) {
      const rowNum = r + 2;
      sheetData += `<row r="${rowNum}">`;
      headers.forEach((h, col) => {
        const val = (rows[r][h] !== undefined && rows[r][h] !== null) ? rows[r][h] : '';
        sheetData += `<c r="${colIndexToLetter(col)}${rowNum}" t="inlineStr"><is><t xml:space="preserve">${xmlEscape(val)}</t></is></c>`;
      });
      sheetData += `</row>`;
    }

    const cols = headers.map((h, i) => {
      const w = (sheets[idx].colWidths && sheets[idx].colWidths[h]) || 16;
      return `<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`;
    }).join('');

    worksheets[`xl/worksheets/sheet${idx+1}.xml`] =
      `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView tabSelected="${idx===0?1:0}" workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>${cols}</cols><sheetData>${sheetData}</sheetData><autoFilter ref="A1:${lastCol}${lastRow>1?lastRow:1}"/></worksheet>`;
  }

  const zipFiles = {
    '[Content_Types].xml': encoder.encode(contentTypes),
    '_rels/.rels': encoder.encode(rootRels),
    'docProps/core.xml': encoder.encode(coreProps),
    'docProps/app.xml': encoder.encode(appProps),
    'xl/workbook.xml': encoder.encode(workbook),
    'xl/_rels/workbook.xml.rels': encoder.encode(workbookRels),
    'xl/styles.xml': encoder.encode(styles),
  };
  for (const [k, v] of Object.entries(worksheets)) zipFiles[k] = encoder.encode(v);

  return buildZIP(zipFiles);
}

window.XLSXMini = {readXLSX, writeXLSX};



/******************************************************************************
 * Lógica de negócio: cruzamento SAP x 4MDG
 * Regras de negócio (validadas):
 *  - Universo de referência = SAP (resultado final tem exatamente os materiais do SAP)
 *  - Chave: SAP.Material == 4MDG.Coluna1
 *  - DE-PARA estrito: "Descrição do material" e "Descrição Longa (Padronizado)" só do 4MDG;
 *    "Descrição Curta (Saneada)" só do SAP (renomeado de "Texto breve material")
 *  - IMPORTANTE: Todos os 26.110 materiais SAP estão na Base Cruzada; campo 4MDG fica vazio se não houver match
 *  - Deduplicação 4MDG por código: 1ª ocorrência não-vazia por campo
 *  - Separação obrigatória: matched (DE-PARA completo) vs sem correspondência
 *****************************************************************************/

const MAX_ROWS = 100000;

const SAP_COL_MATERIAL = 'Material';
const SAP_COL_TIPO = 'Tipo de material';
const SAP_COL_GRUPO_MERC = 'Grupo de mercadorias';
const SAP_COL_DESC_CURTA = 'Texto breve material';

const MDG_COL_CODIGO = 'Código SAP gerado';
const MDG_COL_DESC_MATERIAL = 'Descrição do material';
const MDG_COL_DESC_CURTA = 'Descrição Curta (Saneada)';
const MDG_COL_DESC_LONGA = 'Descrição Longa (Padronizado)';
const MDG_COL_TIPO = 'Tipo de material';
const MDG_COL_GRUPO_MERC = 'Grupo de Mercadorias';
const MDG_COL_GRUPO_COMPRA = 'Grupo de compradores';
const MDG_COL_NCM = 'NCM';

const OUT_COLUMNS = [
  'Coluna1', 'Descrição do material', 'Descrição Curta (Saneada)', 'Descrição Longa (Padronizado)',
  'Tipo de material', 'Grupo de Mercadorias', 'Grupo de compradores', 'NCM'
];

function checkRowLimit(sapData, mdgData) {
  const warnings = [];
  if (sapData.data.length > MAX_ROWS) warnings.push(`Base SAP tem ${sapData.data.length.toLocaleString('pt-BR')} linhas, acima do limite de ${MAX_ROWS.toLocaleString('pt-BR')}.`);
  if (mdgData.data.length > MAX_ROWS) warnings.push(`Base 4MDG tem ${mdgData.data.length.toLocaleString('pt-BR')} linhas, acima do limite de ${MAX_ROWS.toLocaleString('pt-BR')}.`);
  return warnings;
}

function trimRow(row) {
  const out = {};
  for (const k in row) out[k] = (row[k] === null || row[k] === undefined) ? '' : String(row[k]).trim();
  return out;
}

function executarCruzamentoNegocio(sapRaw, mdgRaw) {
  // 1) Normalizar (trim) todas as células
  const sapRows = sapRaw.data.map(trimRow);
  const mdgRowsAll = mdgRaw.data.map(trimRow);

  // 2) Descartar linhas 4MDG sem código
  const mdgWithCode = mdgRowsAll.filter(r => (r[MDG_COL_CODIGO] || '') !== '');
  const discardedNoCode = mdgRowsAll.length - mdgWithCode.length;

  // 3) Deduplicar 4MDG por código (1ª ocorrência não-vazia por campo)
  const mdgByCode = new Map();
  const dupCodesSet = new Set();
  for (const row of mdgWithCode) {
    const code = row[MDG_COL_CODIGO];
    if (!mdgByCode.has(code)) {
      mdgByCode.set(code, {...row});
    } else {
      dupCodesSet.add(code);
      const existing = mdgByCode.get(code);
      for (const field of Object.keys(row)) {
        if ((!existing[field] || existing[field] === '') && row[field]) {
          existing[field] = row[field];
        }
      }
    }
  }
  const dupConsolidatedCount = dupCodesSet.size;
  const mdgUniqueCount = mdgByCode.size;

  // 4) Merge: iterar universo SAP, buscar no Map 4MDG
  const baseCruzada = [];
  const semCorrespondencia = [];
  const comCorrespondencia = [];

  const sapCodesSet = new Set();
  for (const sapRow of sapRows) {
    const material = sapRow[SAP_COL_MATERIAL] || '';
    sapCodesSet.add(material);
    const mdgRow = mdgByCode.get(material) || null;

    const descMaterial = mdgRow ? (mdgRow[MDG_COL_DESC_MATERIAL] || '') : '';
    const descLonga = mdgRow ? (mdgRow[MDG_COL_DESC_LONGA] || '') : '';
    const descCurta = sapRow[SAP_COL_DESC_CURTA] || '';

    const sapTipo = sapRow[SAP_COL_TIPO] || '';
    const mdgTipo = mdgRow ? (mdgRow[MDG_COL_TIPO] || '') : '';
    const tipoMaterial = sapTipo !== '' ? sapTipo : mdgTipo;

    const sapGrupoMerc = sapRow[SAP_COL_GRUPO_MERC] || '';
    const mdgGrupoMerc = mdgRow ? (mdgRow[MDG_COL_GRUPO_MERC] || '') : '';
    const grupoMercadorias = sapGrupoMerc !== '' ? sapGrupoMerc : mdgGrupoMerc;

    const grupoCompradores = mdgRow ? (mdgRow[MDG_COL_GRUPO_COMPRA] || '') : '';
    const ncm = mdgRow ? (mdgRow[MDG_COL_NCM] || '') : '';

    const outRow = {
      'Coluna1': material,
      'Descrição do material': descMaterial,
      'Descrição Curta (Saneada)': descCurta,
      'Descrição Longa (Padronizado)': descLonga,
      'Tipo de material': tipoMaterial,
      'Grupo de Mercadorias': grupoMercadorias,
      'Grupo de compradores': grupoCompradores,
      'NCM': ncm
    };

    // TODOS os materiais SAP vão para Base Cruzada (universo de referência)
    baseCruzada.push(outRow);

    // Separar por correspondência
    const hasMatch = mdgRow !== null;
    if (hasMatch) {
      comCorrespondencia.push(outRow);
    } else {
      semCorrespondencia.push(outRow);
    }
  }

  // 5) Materiais que existem SOMENTE na 4MDG (inativados no SAP)
  const soMdg = [];
  for (const [code, mdgRow] of mdgByCode.entries()) {
    if (!sapCodesSet.has(code)) {
      const auditRow = {
        'Coluna1': code,
        'Descrição do material': mdgRow[MDG_COL_DESC_MATERIAL] || '',
        'Descrição Curta (Saneada)': mdgRow[MDG_COL_DESC_CURTA] || '',
        'Descrição Longa (Padronizado)': mdgRow[MDG_COL_DESC_LONGA] || '',
        'Tipo de material': mdgRow[MDG_COL_TIPO] || '',
        'Grupo de Mercadorias': mdgRow[MDG_COL_GRUPO_MERC] || '',
        'Grupo de compradores': mdgRow[MDG_COL_GRUPO_COMPRA] || '',
        'NCM': mdgRow[MDG_COL_NCM] || ''
      };
      soMdg.push(auditRow);
    }
  }

  const resumo = [
    { 'Indicador': 'Total de materiais SAP (universo de referência)', 'Valor': String(sapRows.length) },
    { 'Indicador': 'Total na Base Cruzada (PRINCIPAL)', 'Valor': String(baseCruzada.length) },
    { 'Indicador': 'Materiais em AMBAS as bases (SAP + 4MDG)', 'Valor': String(comCorrespondencia.length) },
    { 'Indicador': 'Materiais SÓ SAP (sem 4MDG)', 'Valor': String(semCorrespondencia.length) },
    { 'Indicador': 'Materiais SÓ 4MDG (inativados no SAP)', 'Valor': String(soMdg.length) },
    { 'Indicador': 'Códigos 4MDG duplicados consolidados', 'Valor': String(dupConsolidatedCount) },
    { 'Indicador': 'Linhas 4MDG descartadas por falta de código', 'Valor': String(discardedNoCode) },
    { 'Indicador': 'Códigos únicos 4MDG utilizados no cruzamento', 'Valor': String(mdgUniqueCount) },
  ];

  return {
    baseCruzada, comCorrespondencia, semCorrespondencia, soMdg, resumo,
    stats: {
      totalSap: sapRows.length,
      total: baseCruzada.length,
      comMatch: comCorrespondencia.length,
      semMatch: semCorrespondencia.length,
      soMdg: soMdg.length,
      dupConsolidated: dupConsolidatedCount,
      discardedNoCode,
      mdgUniqueCount
    }
  };
}

window.ValidadorBases = {processCruzamento: executarCruzamentoNegocio, checkRowLimit, OUT_COLUMNS, MAX_ROWS};


// ========== App State ==========
let sapFile = null, mdgFile = null;
let sapData = null, mdgData = null;
let processResult = null;

// ========== File Upload Handling ==========
function setupFileInput(inputId, statusId, dropZoneId, onLoad) {
  const input = document.getElementById(inputId);
  const status = document.getElementById(statusId);
  const dropZone = document.getElementById(dropZoneId);

  input.addEventListener('change', e => {
    if (e.target.files[0]) handleFile(e.target.files[0], status, onLoad);
  });

  dropZone.addEventListener('dragover', e => {
    e.preventDefault();
    dropZone.classList.add('dragging');
  });

  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragging'));

  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('dragging');
    if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0], status, onLoad);
  });
}

async function handleFile(file, statusEl, onLoad) {
  if (!file.name.match(/\.(xlsx?|xls)$/i)) {
    showError('Formato inválido. Apenas arquivos .xlsx ou .xls são aceitos.');
    return;
  }
  statusEl.innerHTML = `<div class="upload-feedback"><span class="upload-feedback-icon">✓</span><span><strong>${file.name}</strong> (${(file.size/1024/1024).toFixed(2)} MB) - Arquivo carregado</span></div>`;
  statusEl.classList.remove('hidden');
  onLoad(file);
  checkReadyToProcess();
}

function checkReadyToProcess() {
  document.getElementById('btn-process').disabled = !(sapFile && mdgFile);
}

// ========== Processing ==========
async function processCruzamento() {
  hideError();
  document.getElementById('upload-section').style.opacity = '0.6';
  document.getElementById('btn-process').disabled = true;
  showProgress('Carregando Base SAP...', 10);

  try {
    if (typeof DecompressionStream === 'undefined') {
      throw new Error('Seu navegador não suporta a leitura de arquivos XLSX (DecompressionStream não disponível). Use Chrome/Edge 80+, Firefox 102+ ou Safari 16.4+.');
    }

    console.log('[processCruzamento] Lendo SAP...');
    const sapBuf = await sapFile.arrayBuffer();
    console.log('[processCruzamento] sapBuf size:', sapBuf.byteLength);
    showProgress('Processando Base SAP...', 20);
    sapData = await XLSXMini.readXLSX(sapBuf);

    if (!sapData || typeof sapData !== 'object') {
      throw new Error('Base SAP: arquivo não pôde ser lido (estrutura inválida). Tipo retornado: ' + typeof sapData);
    }
    if (!sapData.headers || !Array.isArray(sapData.headers)) {
      throw new Error('Base SAP: headers ausentes ou invalidos. Tipo: ' + typeof sapData.headers);
    }
    if (!sapData.data || !Array.isArray(sapData.data)) {
      throw new Error('Base SAP: data ausente ou invalido. Tipo: ' + typeof sapData.data);
    }
    if (sapData.data.length === 0) {
      throw new Error('Base SAP: arquivo está vazio (sem linhas de dados)');
    }
    console.log('[processCruzamento] SAP OK:', sapData.data.length, 'linhas');

    showProgress('Carregando Base 4MDG...', 40);
    console.log('[processCruzamento] Lendo 4MDG...');
    const mdgBuf = await mdgFile.arrayBuffer();
    console.log('[processCruzamento] mdgBuf size:', mdgBuf.byteLength);
    showProgress('Processando Base 4MDG...', 50);
    mdgData = await XLSXMini.readXLSX(mdgBuf);

    if (!mdgData || typeof mdgData !== 'object') {
      throw new Error('Base 4MDG: arquivo não pôde ser lido (estrutura inválida). Tipo retornado: ' + typeof mdgData);
    }
    if (!mdgData.headers || !Array.isArray(mdgData.headers)) {
      throw new Error('Base 4MDG: headers ausentes ou invalidos. Tipo: ' + typeof mdgData.headers);
    }
    if (!mdgData.data || !Array.isArray(mdgData.data)) {
      throw new Error('Base 4MDG: data ausente ou invalido. Tipo: ' + typeof mdgData.data);
    }
    if (mdgData.data.length === 0) {
      throw new Error('Base 4MDG: arquivo está vazio (sem linhas de dados)');
    }
    console.log('[processCruzamento] 4MDG OK:', mdgData.data.length, 'linhas');

    showProgress('Validando limites...', 60);
    console.log('[processCruzamento] checkRowLimit...');
    const warnings = ValidadorBases.checkRowLimit(sapData, mdgData);
    if (!Array.isArray(warnings)) {
      throw new Error('[BUG] checkRowLimit nao retornou array. Tipo: ' + typeof warnings);
    }
    if (warnings.length > 0) {
      throw new Error('LIMITE EXCEDIDO:\n' + warnings.join('\n'));
    }

    showProgress('Executando cruzamento...', 70);
    console.log('[processCruzamento] Chamando ValidadorBases.processCruzamento...');
    processResult = ValidadorBases.processCruzamento(sapData, mdgData);
    console.log('[processCruzamento] Cruzamento OK:', JSON.stringify(processResult.stats));

    showProgress('Gerando arquivo XLSX...', 85);
    console.log('[processCruzamento] generateXLSX...');
    await generateXLSX();
    console.log('[processCruzamento] XLSX gerado');

    showProgress('Concluído!', 100);
    setTimeout(() => {
      try {
        console.log('[processCruzamento] setTimeout: hideProgress');
        hideProgress();
        console.log('[processCruzamento] setTimeout: showResults');
        showResults();
        console.log('[processCruzamento] setTimeout: saveLastRun');
        saveLastRun();
        console.log('[processCruzamento] setTimeout: Tudo concluido');
      } catch (errTimeout) {
        console.error('[processCruzamento] ERRO dentro do setTimeout:', errTimeout);
        showError('Erro ao exibir resultados: ' + (errTimeout.message || String(errTimeout)));
      }
    }, 500);
  } catch (err) {
    console.error('[processCruzamento] ERRO no try/catch principal:', err);
    hideProgress();
    const msg = err.message || String(err);
    showError(msg.includes('LIMITE EXCEDIDO') ? msg : `Erro ao processar:\n${msg}`);
    document.getElementById('upload-section').style.opacity = '1';
    document.getElementById('btn-process').disabled = false;
  }
}


async function generateXLSX() {
  const colWidths = {
    'Coluna1': 15, 'Descrição do material': 35, 'Descrição Curta (Saneada)': 35,
    'Descrição Longa (Padronizado)': 45, 'Tipo de material': 15, 'Grupo de Mercadorias': 20,
    'Grupo de compradores': 20, 'NCM': 14
  };

  const allSheets = [
    {name: 'Base Cruzada (PRINCIPAL)', headers: ValidadorBases.OUT_COLUMNS, rows: processResult.baseCruzada, colWidths},
    {name: 'Em Ambas as Bases', headers: ValidadorBases.OUT_COLUMNS, rows: processResult.comCorrespondencia, colWidths},
    {name: 'Só SAP (sem 4MDG)', headers: ValidadorBases.OUT_COLUMNS, rows: processResult.semCorrespondencia, colWidths},
    {name: 'Só 4MDG (inativados)', headers: ValidadorBases.OUT_COLUMNS, rows: processResult.soMdg, colWidths},
    {name: 'Resumo', headers: ['Indicador', 'Valor'], rows: processResult.resumo, colWidths: {'Indicador': 52, 'Valor': 14}}
  ];

  // Filtrar sheets selecionadas
  const selectedSheets = allSheets.filter(sheet => {
    const checkbox = document.getElementById('sheet-' + (
      sheet.name === 'Base Cruzada (PRINCIPAL)' ? 'principal' :
      sheet.name === 'Em Ambas as Bases' ? 'ambas' :
      sheet.name === 'Só SAP (sem 4MDG)' ? 'sap' :
      sheet.name === 'Só 4MDG (inativados)' ? 'mdg' : 'resumo'
    ));
    return checkbox && checkbox.checked;
  });

  window.resultBlob = new Blob([XLSXMini.writeXLSX(selectedSheets.length > 0 ? selectedSheets : allSheets)], {type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

// ========== UI Updates ==========
function showProgress(text, pct) {
  const sec = document.getElementById('progress-section');
  sec.classList.remove('hidden');
  document.getElementById('progress-fill').style.width = pct + '%';
  const progressText = document.getElementById('progress-text');
  progressText.textContent = text;
  progressText.innerHTML += `<div class="progress-detail">${pct}% concluído</div>`;
}

function hideProgress() {
  document.getElementById('progress-section').classList.add('hidden');
}

function showError(msg) {
  const box = document.getElementById('error-box');
  box.textContent = msg;
  box.classList.remove('hidden');
}

function hideError() {
  document.getElementById('error-box').classList.add('hidden');
}

function showResults() {
  document.getElementById('results-section').classList.remove('hidden');
  const grid = document.getElementById('results-grid');

  const pctMatch = ((processResult.stats.comMatch / processResult.stats.totalSap) * 100).toFixed(1);
  const pctComplete = ((processResult.stats.comMatch / processResult.stats.totalSap) * 100).toFixed(1);

  grid.innerHTML = `
    <div class="stat-card accent animate-in" style="animation-delay:0s;">
      <div class="stat-label">Total SAP (universo)</div>
      <div class="stat-value">${processResult.stats.totalSap.toLocaleString('pt-BR')}</div>
      <div class="stat-detail">Materiais de referência</div>
    </div>
    <div class="stat-card success animate-in" style="animation-delay:0.1s;">
      <div class="stat-label">Em Ambas as Bases (completo)</div>
      <div class="stat-value">${processResult.stats.comMatch.toLocaleString('pt-BR')}</div>
      <div class="stat-detail">${pctMatch}% com "Descrição Longa" preenchida</div>
    </div>
    <div class="stat-card warning animate-in" style="animation-delay:0.2s;">
      <div class="stat-label">Só SAP (sem 4MDG)</div>
      <div class="stat-value">${processResult.stats.semMatch.toLocaleString('pt-BR')}</div>
      <div class="stat-detail">Campos 4MDG vazios</div>
    </div>
    <div class="stat-card animate-in" style="animation-delay:0.3s;">
      <div class="stat-label">Só 4MDG (inativados)</div>
      <div class="stat-value">${processResult.stats.soMdg.toLocaleString('pt-BR')}</div>
      <div class="stat-detail">Fora da Base Cruzada</div>
    </div>
  `;

  switchTab('principal');
  updateTabCounters();
  document.getElementById('upload-section').scrollIntoView({behavior: 'smooth', block: 'start'});
}

let currentTab = 'principal';
function switchTab(tab) {
  currentTab = tab;
  const tabContent = document.getElementById('tab-content');
  const searchInput = document.getElementById('search-input');
  const searchResults = document.getElementById('search-results');
  const tabs = document.querySelectorAll('.tab-btn');
  tabs.forEach(btn => btn.style.borderBottomColor = btn.classList.contains('active') ? 'var(--accent)' : 'transparent');

  let data, count, desc;
  if (tab === 'principal') {
    data = processResult.baseCruzada;
    count = data.length;
    desc = `Base Cruzada (PRINCIPAL - ${count.toLocaleString('pt-BR')} materiais): Todos os materiais SAP com campos 4MDG preenchidos quando houver correspondência. ✓ Esse é o resultado final que você precisa.`;
  } else if (tab === 'ambas') {
    data = processResult.comCorrespondencia;
    count = data.length;
    desc = `Em Ambas as Bases (${count.toLocaleString('pt-BR')} materiais): Materiais que existem TANTO no SAP quanto na 4MDG com correspondência completa.`;
  } else if (tab === 'soSap') {
    data = processResult.semCorrespondencia;
    count = data.length;
    desc = `Só SAP sem 4MDG (${count.toLocaleString('pt-BR')} materiais): Criados no SAP sem correspondência na 4MDG. Campos 4MDG vazios. Ainda na Base Cruzada pois SAP é fiel.`;
  } else if (tab === 'soMdg') {
    data = processResult.soMdg;
    count = data.length;
    desc = `Só 4MDG / Inativados (${count.toLocaleString('pt-BR')} materiais): Existem na 4MDG mas foram INATIVADOS no SAP. NÃO entram na Base Cruzada (SAP é fiel). Apenas auditoria.`;
  }

  tabContent.innerHTML = `<strong>${desc.split(':')[0]}:</strong><br>${desc.split(': ').slice(1).join(': ')}`;
  searchInput.style.display = 'block';
  searchInput.value = '';
  searchResults.style.display = 'none';
  searchResults.innerHTML = '';

  // Atualizar contadores
  updateTabCounters();

  // Atualizar visual dos botões
  tabs.forEach(btn => btn.classList.remove('active'));
  event.target.classList.add('active');
  event.target.style.borderBottomColor = 'var(--accent)';
}

function updateTabCounters() {
  document.getElementById('counter-principal').textContent = processResult.baseCruzada.length.toLocaleString('pt-BR');
  document.getElementById('counter-ambas').textContent = processResult.comCorrespondencia.length.toLocaleString('pt-BR');
  document.getElementById('counter-sap').textContent = processResult.semCorrespondencia.length.toLocaleString('pt-BR');
  document.getElementById('counter-mdg').textContent = processResult.soMdg.length.toLocaleString('pt-BR');
}

// Busca em tempo real nas abas
document.addEventListener('DOMContentLoaded', () => {
  const searchInput = document.getElementById('search-input');
  if (searchInput) {
    searchInput.addEventListener('input', () => {
      const query = searchInput.value.trim().toLowerCase();
      const searchResults = document.getElementById('search-results');
      if (!query) {
        searchResults.style.display = 'none';
        searchResults.innerHTML = '';
        return;
      }

      let data;
      if (currentTab === 'principal') data = processResult.baseCruzada;
      else if (currentTab === 'ambas') data = processResult.comCorrespondencia;
      else if (currentTab === 'soSap') data = processResult.semCorrespondencia;
      else if (currentTab === 'soMdg') data = processResult.soMdg;
      else data = [];

      const filtered = data.filter(row => (row['Coluna1'] || '').toLowerCase().includes(query)).slice(0, 50);
      if (filtered.length === 0) {
        searchResults.innerHTML = '<div style="padding:1rem;color:var(--text-secondary);">Nenhum material encontrado</div>';
      } else {
        searchResults.innerHTML = `<div style="padding:0.5rem;color:var(--text-secondary);font-size:0.85rem;"><strong>Encontrados ${filtered.length} resultado(s):</strong></div>` +
          filtered.map(row => `<div style="padding:0.75rem;border-bottom:1px solid var(--border);font-family:monospace;font-size:0.875rem;word-break:break-all;"><span class="indicator-${row['Descrição Longa (Padronizado)'] ? 'filled' : 'empty'}"></span><strong>${row['Coluna1']}</strong><br><small style="color:var(--text-secondary);">${row['Descrição do material'] || '(vazio)'}</small></div>`).join('');
      }
      searchResults.style.display = 'block';
    });
  }
});

function populateAudit() {
  const sapOnly = processResult.semCorrespondencia.map(r => r['Coluna1']);
  document.getElementById('audit-sap-only').innerHTML = `
    <strong>SAP sem match no 4MDG (${sapOnly.length} códigos):</strong>
    <div style="max-height:200px;overflow-y:auto;margin-top:0.5rem;">
      ${sapOnly.slice(0, 100).join(', ')}${sapOnly.length > 100 ? '...' : ''}
    </div>
  `;

  const mdgCodesInResult = new Set([...processResult.baseCruzada, ...processResult.semCorrespondencia].map(r => r['Coluna1']));
  const mdgOnlySet = new Set();
  mdgData.data.forEach(row => {
    const code = (row['Coluna1'] || '').trim();
    if (code && !mdgCodesInResult.has(code)) mdgOnlySet.add(code);
  });
  const mdgOnly = Array.from(mdgOnlySet);
  document.getElementById('audit-4mdg-only').innerHTML = `
    <strong>4MDG sem match no SAP (${mdgOnly.length} códigos):</strong>
    <div style="max-height:200px;overflow-y:auto;margin-top:0.5rem;">
      ${mdgOnly.slice(0, 100).join(', ')}${mdgOnly.length > 100 ? '...' : ''}
    </div>
  `;
}

function toggleAudit() {
  const content = document.getElementById('audit-content');
  const toggle = document.getElementById('audit-toggle');
  const isCollapsed = content.classList.toggle('collapsed');
  toggle.textContent = isCollapsed ? 'Expandir' : 'Recolher';
}

function downloadResult() {
  if (!window.resultBlob) return;
  const url = URL.createObjectURL(window.resultBlob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `Base_Cruzada_SAP_x_4MDG_${new Date().toISOString().slice(0,10)}.xlsx`;
  a.click();
  URL.revokeObjectURL(url);
}

// ========== LocalStorage Persistence ==========
function saveLastRun() {
  const summary = {
    timestamp: new Date().toISOString(),
    sapRows: processResult.stats.totalSap,
    mdgRows: mdgData.data.length,
    matched: processResult.stats.comMatch,
    unmatched: processResult.stats.semMatch
  };
  localStorage.setItem('validador_last_run', JSON.stringify(summary));
}

function loadLastRun() {
  const data = localStorage.getItem('validador_last_run');
  if (data) {
    const summary = JSON.parse(data);
    console.log('Última execução:', new Date(summary.timestamp).toLocaleString('pt-BR'));
  }
}

// ========== Init ==========
setupFileInput('file-sap', 'status-sap', 'drop-zone-sap', f => { sapFile = f; });
setupFileInput('file-4mdg', 'status-4mdg', 'drop-zone-4mdg', f => { mdgFile = f; });
document.getElementById('btn-process').onclick = processCruzamento;
document.getElementById('btn-download').onclick = downloadResult;
loadLastRun();

</script>
